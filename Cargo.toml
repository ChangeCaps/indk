[package]
name = "indk"
version = "0.1.0"
edition.workspace = true
publish = false

[workspace]
members = [
  "indk-proto",
  "indk-server",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
indk-proto  = { path = "indk-proto"  }
indk-server = { path = "indk-server" }

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
indk-proto.workspace = true

eyre = "0.6"
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3", default-features = false }
reqwest-websocket = { version = "0.6", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }

ori-native = { git = "https://github.com/ori-ui/ori-native" }

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["native-tls"]

[dependencies.openssl]
version = "0.10"
features = ["vendored"]

[package.metadata.android]
package = "org.indk.indk"
name = "Indk"
key-properties = "key.properties"

[profile.dev]
opt-level = 1
overflow-checks = false
debug = "limited"
